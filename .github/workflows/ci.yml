name: Capstone CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Django dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Django checks and tests
        working-directory: server
        run: |
          python manage.py check
          python manage.py test djangoapp
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/frontend/package-lock.json
      - name: Install React dependencies
        working-directory: server/frontend
        run: npm ci
      - name: Build React
        working-directory: server/frontend
        run: npm run build
      - name: Validate Express syntax
        run: node --check server/database/app.js
